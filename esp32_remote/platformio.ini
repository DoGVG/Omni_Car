[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.f_cpu = 160000000L
lib_deps =
    links2004/WebSockets@^2.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 (VID 303A) -> COM14 ; STM32 CH340 (VID 1A86) -> COM7
upload_port = COM14
monitor_port = COM14

; C3 native USB: stub flasher often fails, use --no-stub
upload_flags = --no-stub
upload_speed = 115200
